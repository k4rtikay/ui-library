name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build-and-lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
            - name: set up node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"
            - name: install dependencies
              run: pnpm install --frozen-lockfile
            - name: Run Linter
              run: pnpm run lint
            - name: build
              run: pnpm run build
